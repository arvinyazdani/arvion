# Free origin microcache. This is NOT the Arvan edge cache. All request and
# response gates must pass; never ignore Cache-Control, Set-Cookie, or Vary.
proxy_cache_path /var/cache/nginx/rvion-public levels=1:2
    keys_zone=RVIONPUBLIC:10m max_size=128m inactive=10m use_temp_path=off;

map $uri $rvion_cache_path_skip {
    default 1;
    ~^/(fa|en)/(services/([a-z0-9-]+/)?|blog/([a-z0-9-]+/)?|tools/cost-calculator/|about/|company/|privacy/|service-terms/|refund-policy/)?$ 0;
}
map $request_method $rvion_cache_method_skip {
    default 1;
    GET 0;
    HEAD 0;
}
map $http_cookie $rvion_cache_cookie_skip { default 1; "" 0; }
map $http_authorization $rvion_cache_auth_skip { default 1; "" 0; }
map $args $rvion_cache_query_skip { default 1; "" 0; }
map $host $rvion_cache_host_skip {
    default 1;
    rvionai.com 0;
    www.rvionai.com 0;
}
map "$rvion_cache_path_skip$rvion_cache_method_skip$rvion_cache_cookie_skip$rvion_cache_auth_skip$rvion_cache_query_skip$rvion_cache_host_skip" $rvion_cache_skip {
    default 1;
    "000000" 0;
}
map $upstream_http_cache_control $rvion_cache_response_skip {
    default 1;
    ~*(private|no-store|no-cache) 1;
    ~*public 0;
}
map $upstream_status $rvion_cache_status_skip { default 1; "200" 0; }
map $upstream_cache_status $rvion_cache_outcome {
    default $upstream_cache_status;
    "" "BYPASS";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name rvionai.com www.rvionai.com 188.121.101.173;
    client_max_body_size 5m;
    server_tokens off;
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/manifest+json application/xml image/svg+xml;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type text/plain; }
    location /static/ { alias /srv/arvion/staticfiles/; access_log off; expires 30d; add_header Cache-Control "public" always; }
    location /media/ { alias /srv/arvion/media/; access_log off; expires 1d; }
    location / {
        proxy_cache RVIONPUBLIC;
        proxy_cache_key "$scheme|$host|$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 60s;
        proxy_cache_bypass $rvion_cache_skip;
        proxy_no_cache $rvion_cache_skip $rvion_cache_response_skip $rvion_cache_status_skip $upstream_http_set_cookie;
        proxy_cache_lock on;
        proxy_cache_use_stale off;
        add_header X-Rvion-Origin-Cache $rvion_cache_outcome always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rvionai.com www.rvionai.com;
    client_max_body_size 5m;
    server_tokens off;
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/manifest+json application/xml image/svg+xml;

    ssl_certificate /etc/nginx/ssl/rvionai.crt;
    ssl_certificate_key /etc/nginx/ssl/rvionai.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RVIONSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type text/plain; }
    location /static/ { alias /srv/arvion/staticfiles/; access_log off; expires 30d; add_header Cache-Control "public" always; }
    location /media/ { alias /srv/arvion/media/; access_log off; expires 1d; }
    location / {
        proxy_cache RVIONPUBLIC;
        proxy_cache_key "$scheme|$host|$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 60s;
        proxy_cache_bypass $rvion_cache_skip;
        proxy_no_cache $rvion_cache_skip $rvion_cache_response_skip $rvion_cache_status_skip $upstream_http_set_cookie;
        proxy_cache_lock on;
        proxy_cache_use_stale off;
        add_header X-Rvion-Origin-Cache $rvion_cache_outcome always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
    }
}
