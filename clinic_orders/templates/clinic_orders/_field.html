<div class="field{% if field.field.widget.input_type == 'checkbox' %} crm-options{% endif %}{% if field.errors %} field-error{% endif %}" data-field-name="{{ field.name }}">
  <label{% if field.id_for_label %} for="{{ field.id_for_label }}"{% endif %}>{{ field.label }}{% if field.field.required %} <span class="required-mark" aria-hidden="true">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<small id="{{ field.id_for_label }}-help">{{ field.help_text }}</small>{% endif %}
  {{ field.errors }}
</div>
