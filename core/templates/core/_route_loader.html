<div class="route-loader" data-navigation-loader aria-hidden="true" role="status" aria-label="{% if lang == 'en' or request.LANGUAGE_CODE == 'en' %}Loading page{% else %}در حال بارگذاری صفحه{% endif %}">
  <div class="route-loader__content">
    {% include 'core/includes/brand.html' with mark_class='route-loader__mark' mark_only=True %}
    <span class="route-loader__label">{% if lang == 'en' or request.LANGUAGE_CODE == 'en' %}Loading…{% else %}در حال بارگذاری…{% endif %}</span>
    <div class="route-loader__progress" aria-hidden="true"><span></span></div>
  </div>
</div>
