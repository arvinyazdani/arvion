  <div class="welcome-orbit orbit-one" aria-hidden="true"></div>
  <div class="welcome-orbit orbit-two" aria-hidden="true"></div>
  <div class="welcome-brand">
    {% include 'core/includes/brand.html' with mark_class='welcome-mark' %}

  </div>
  <div class="welcome-progress" aria-hidden="true"><span></span></div>
